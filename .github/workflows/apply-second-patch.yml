name: Aplicar segundo commit, verificar y guardar ref validada
on:
  push:
    branches:
      - agent-builder-parche-verificacion-20261115
    paths:
      - patches/segundo.patch.gz.b64
permissions:
  contents: write
jobs:
  git-am-y-pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Recuperar parche original del segundo commit
        run: |
          base64 -d patches/segundo.patch.gz.b64 | gzip -d > "${RUNNER_TEMP}/segundo.patch"
          sha256sum "${RUNNER_TEMP}/segundo.patch"
          echo "SHA256 esperado: 0e96e8833f5053adcf08ff4d15de1e88116486c9594517a021b4577b6efbaac3"
          echo "0e96e8833f5053adcf08ff4d15de1e88116486c9594517a021b4577b6efbaac3  ${RUNNER_TEMP}/segundo.patch" | sha256sum --check
      - name: Partir del primer commit y aplicar segundo conservando autor
        run: |
          git checkout --detach d62b0bb95acd84e3a5d193729ac5267196cf04a6
          git config user.name "francopdimauro-cyber"
          git config user.email "francopdimauro-cyber@users.noreply.github.com"
          export GIT_COMMITTER_NAME="francopdimauro-cyber"
          export GIT_COMMITTER_EMAIL="francopdimauro-cyber@users.noreply.github.com"
          export GIT_COMMITTER_DATE="Sun, 15 Nov 2026 08:20:33 +0000"
          git am "${RUNNER_TEMP}/segundo.patch"
          git diff --check HEAD~2..HEAD
          git log -2 --pretty=format:'%H %an <%ae> %s'
      - name: Instalar dependencias
        run: npm install
      - name: Ejecutar 46 tests
        run: npm test
      - name: Typecheck limpio
        run: npm run typecheck
      - name: Guardar los dos commits originales en rama validada (no main)
        run: git push origin HEAD:refs/heads/agent-builder-parche-validado-20261115
