name: Probar HTTP de widget.js en Cloudflare
on:
  push:
    branches:
      - agent-builder-parche-verificacion-20261115
    paths:
      - .github/workflows/probar-widget-cloudflare.yml
permissions:
  contents: read
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar respuesta real del widget
        shell: bash
        run: |
          set -euo pipefail
          URL='https://agent-factory-free.francopdimauro.workers.dev/widget.js'
          STATUS=$(curl --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 30 -sSL -D /tmp/widget.headers -o /tmp/widget.js -w '%{http_code}' "$URL")
          echo "URL: $URL"
          echo "HTTP status: $STATUS"
          sed -n '1,20p' /tmp/widget.headers
          echo "Downloaded bytes: $(wc -c </tmp/widget.js)"
          test "$STATUS" = 200
          test "$(wc -c </tmp/widget.js)" -gt 1000
          grep -Eq 'attachShadow|data-chat|createElement' /tmp/widget.js
          echo 'RESULTADO: /widget.js responde HTTP 200 y devuelve Javascript del widget'
      - name: Comprobar portada del Worker
        shell: bash
        run: |
          URL='https://agent-factory-free.francopdimauro.workers.dev/'
          CODE=$(curl --retry 3 --retry-all-errors --retry-delay 2 -sSL -o /tmp/agent-index -w '%{http_code}' "$URL")
          echo "Portada HTTP: $CODE"
          test "$CODE" = 200
